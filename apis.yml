aid: stegra
name: Stegra
description: 'Stegra (formerly H2 Green Steel) is a Stockholm-headquartered industrial
  company, founded in 2020 and backed by Vargas Holding, building what it describes
  as Europe''s first large-scale near-zero-emission steel plant in Boden, northern
  Sweden. The 270-hectare Boden site integrates a giga-scale electrolyzer producing
  green hydrogen from renewable Nordic electricity, a direct-reduction plant making
  green iron without coking coal, and a downstream steel mill — a combination Stegra
  says cuts steelmaking emissions by roughly 95 percent versus the blast-furnace route.
  Its commercial products are green steel, green iron and green hydrogen, sold to
  automotive, construction and appliance customers. Stegra is a heavy-industry manufacturer
  rather than a software vendor: it operates no public developer portal, publishes
  no API documentation, and serves no machine-readable API contract. Its only public
  engineering surface is the stegraab GitHub organization, which maintains community
  Terraform providers and a tflint ruleset used for its own internal infrastructure.'
